name: CI

on:
  push:
    branches: [phase2-frontend-flow]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Build and test
        run: ./mvnw -B clean verify

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
        env:
          # Same issue as the Docker build fix (see memory.md): this is a
          # required env var (lib/env.ts fails fast if missing), and it
          # gets baked in at build time. CI only needs the build to
          # succeed, not a real backend URL - a placeholder is fine here.
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8080