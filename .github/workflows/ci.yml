name: CI

on:
  push:
    branches: [phase10]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Build and test
        run: ./mvnw -B clean verify

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - name: Build (direct mode - rollback path must keep working)
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
        run: npm run build
      - name: Build (same-origin proxy mode)
        env:
          NEXT_PUBLIC_API_BASE_URL: ""
          BACKEND_ORIGIN: http://localhost:8080
        run: npm run build
      - name: Proxy smoke test (stub backend, built app)
        run: npm run smoke:proxy