spring:
  application:
    name: firstfood-v2
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

app:
  jwt:
    # No default on purpose (FirstFood_V2_Phase1_Review.md #9): missing
    # JWT_SECRET must fail application startup, not silently fall back to
    # a value anyone can read in this repo. Local/test profiles supply
    # their own throwaway value below via application-local.yml /
    # application-test.yml.
    secret: ${JWT_SECRET}
    access-token-ttl-minutes: 15
    refresh-token-ttl-days: 30
  otp:
    ttl-minutes: 5
    max-attempts: 5
    request-rate-limit-per-hour: 5

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
